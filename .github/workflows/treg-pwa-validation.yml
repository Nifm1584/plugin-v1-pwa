name: TREG PWA validation

on:
  push:
    branches:
      - fix/treg-pwa-c3-publicacao-segura
      - fix/treg-pwa-c7-qrcode-fix
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml fastapi pydantic
      - name: Install Node test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check dashboard/pwa/app.js
          node --check dashboard/pwa/hermes-api.js
          node --check dashboard/dist/index.js
          node --check dashboard/dist/qrcode.js
          node --check dashboard/pwa/sw.js
          node --check tests/qrcode.test.js
          node --check tests/hermes-api.test.js
          node --check tests/ui-contract.test.js
      - name: Run API compatibility tests
        working-directory: tests
        run: npm run test:api
      - name: Run UI contract tests
        working-directory: tests
        run: npm run test:ui
      - name: Run QR code round-trip tests
        working-directory: tests
        run: npm run test:qrcode
      - name: Compile Python plugin files
        run: python -m py_compile __init__.py dashboard/plugin_api.py
      - name: Run plugin tests
        run: python -m pytest tests -q
