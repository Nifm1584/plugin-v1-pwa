<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TREG">
<title>TREG — Fase 5B</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
(function () {
  try {
    var pref = localStorage.getItem("treg-pwa-theme");
    if (pref === "dark") pref = "black";
    if (pref !== "light" && pref !== "black") pref = "auto";
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var palette = pref === "auto" ? (dark ? "auto-dark" : "auto-light") : pref;
    document.documentElement.setAttribute("data-theme", palette);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", palette === "black" ? "#000000" : (palette === "auto-dark" ? "#0f2f31" : "#ffffff"));
  } catch (error) {
    document.documentElement.setAttribute("data-theme", "auto-light");
  }
})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="net-banner" class="net-banner hidden" role="status" aria-live="polite"></div>
<div id="app" class="app">
  <aside id="list" class="pane list">
    <header class="bar">
      <div class="brand" aria-hidden="true"><span class="brand-avatar"><span id="header-avatar-glyph">☤</span><img id="header-avatar-img" class="avatar-img hidden" alt=""></span></div>
      <div class="actions">
        <button id="btn-search" class="icon" type="button" title="Buscar conversa" aria-label="Buscar conversa" aria-controls="search-row" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg></button>
        <button id="btn-header-menu" class="icon" type="button" title="Mais opções" aria-label="Mais opções" aria-haspopup="menu" aria-expanded="false" aria-controls="header-menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      </div>
      <div id="header-menu" class="header-menu hidden" role="menu" aria-labelledby="btn-header-menu">
        <button id="btn-refresh" class="menu-item" type="button" role="menuitem"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span>Atualizar</span></button>
        <button id="btn-settings" class="menu-item" type="button" role="menuitem"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Configurações</span></button>
      </div>
    </header>
    <div id="search-row" class="search hidden" role="search">
      <input id="search" type="search" placeholder="Buscar conversa" autocomplete="off" enterkeyhint="search" aria-label="Buscar conversa">
    </div>
    <div class="agentbar">
      <label for="agent">Agente</label>
      <select id="agent" class="agent-select"><option value="default">default</option></select>
      <span id="agent-model" class="agent-model"></span>
    </div>
    <div id="list-status" class="list-status hidden" role="status" aria-live="polite"></div>
    <div id="list-skeleton" class="skeleton-list hidden" aria-hidden="true">
      <div class="skeleton-row"><i></i><span></span></div>
      <div class="skeleton-row"><i></i><span></span></div>
      <div class="skeleton-row"><i></i><span></span></div>
    </div>
    <ul id="sessions" class="sessions" aria-live="polite"></ul>
    <div id="list-empty" class="empty hidden">Nenhuma conversa ainda. Use o botão + abaixo para começar.</div>
    <div id="list-foot" class="list-foot hidden"><button id="btn-more" type="button" class="btn ghost">Carregar mais</button></div>
    <div class="list-actions">
      <button id="btn-new" class="icon primary" title="Nova conversa" aria-label="Nova conversa"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </aside>

  <main id="chat" class="pane chat hidden">
    <header class="bar">
      <button id="btn-back" class="icon" aria-label="Voltar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div id="chat-avatar" class="avatar chat-avatar" aria-hidden="true">T</div>
      <div class="title-wrap">
        <div id="chat-title" class="title">—</div>
        <div id="chat-sub" class="sub"></div>
      </div>
      <div class="actions">
        <button id="btn-stop" class="icon stop hidden" type="button" title="Parar execução" aria-label="Parar execução"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button id="btn-menu" class="icon" type="button" aria-label="Opções"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      </div>
    </header>
    <div class="messages-wrap">
      <div id="messages" class="messages" role="log" aria-live="polite"></div>
      <button id="btn-scroll-bottom" class="scroll-bottom hidden" type="button" title="Ir para a última mensagem" aria-label="Ir para a última mensagem"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    </div>
    <div id="chat-status" class="chat-status hidden" role="status" aria-live="polite"></div>
    <div id="typing" class="typing hidden" role="status" aria-live="polite"><span class="dots"><i></i><i></i><i></i></span><span id="typing-text">pensando…</span></div>
    <div id="tray" class="tray hidden"></div>
    <div id="rec" class="rec hidden"><span class="rec-dot"></span><span id="rec-time">0:00</span><span class="co-muted">gravando…</span><button id="btn-rec-cancel" type="button" class="rec-cancel">Cancelar</button></div>
    <form id="composer" class="composer" autocomplete="off">
      <input id="file" type="file" multiple accept="image/*,audio/*,video/*,.pdf,.txt,.md,.csv,.json,.xml,.html,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip" class="hidden">
      <button id="btn-attach" type="button" class="icon" aria-label="Anexar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05 12.5 20a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.5 3.5 0 0 1 5 5l-9.2 9.2a1.5 1.5 0 0 1-2.1-2.1L16 6.7"/></svg></button>
      <textarea id="input" rows="1" placeholder="Mensagem" enterkeyhint="send" aria-label="Mensagem"></textarea>
      <button id="btn-mic" type="button" class="icon" aria-label="Gravar áudio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="btn-send" type="submit" class="send" aria-label="Enviar"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-1.9-7.6z"/></svg></button>
    </form>
  </main>

  <div id="placeholder" class="pane placeholder">
    <div><div class="logo big">☤</div><p>Escolha uma conversa ou crie uma nova.</p></div>
  </div>
</div>

<div id="sheet" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-title">—</div>
    <button data-act="pin">Fixar conversa</button>
    <button data-act="rename">Renomear conversa</button>
    <button data-act="reload">Recarregar mensagens</button>
    <button data-act="delete" class="danger">Apagar conversa</button>
    <button data-act="close" class="muted">Cancelar</button>
  </div>
</div>

<div id="settings" class="sheet hidden">
  <div class="sheet-card">
    <div class="settings-section profile-photo-section">
      <div class="sheet-title">Perfil</div>
      <div class="profile-photo-row">
        <div id="profile-avatar-preview" class="profile-avatar-preview" aria-hidden="true">
          <span id="profile-avatar-glyph">☤</span>
          <img id="profile-avatar-img" class="avatar-img hidden" alt="">
        </div>
        <div class="profile-photo-actions">
          <button type="button" id="btn-avatar-pick" class="btn primary">Escolher foto</button>
          <button type="button" id="btn-avatar-remove" class="btn ghost hidden">Remover foto</button>
          <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" class="hidden" aria-label="Escolher foto do perfil">
        </div>
      </div>
      <p id="avatar-status" class="avatar-status" role="status" aria-live="polite"></p>
    </div>
    <div class="settings-section">
      <div class="sheet-title">Aparência</div>
      <div class="theme-options" role="group" aria-label="Tema">
        <button type="button" data-theme-choice="auto" aria-pressed="false">Auto</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="black" aria-pressed="false">Black</button>
      </div>
    </div>
    <div class="sheet-title">Autorização de comandos</div>
    <p id="settings-sub" class="sheet-text"></p>
    <button data-mode="manual" class="opt"><b>Sempre perguntar</b><span>Pede autorização para todo comando perigoso.</span></button>
    <button data-mode="smart" class="opt"><b>Inteligente</b><span>Só pede autorização quando o comando parece arriscado.</span></button>
    <button data-mode="off" class="opt risk"><b>Não perguntar</b><span>Executa tudo sem pedir. Use só em servidor de teste ou dedicado ao agente.</span></button>
    <button data-act="close" class="muted">Fechar</button>
    <div id="app-version" class="about-version">TREG · Fase 5B · 1.8.0b1</div>
  </div>
</div>

<div id="login" class="login hidden">
  <form id="login-form" class="login-card">
    <div class="logo big">☤</div>
    <h1>Entrar no Hermes</h1>
    <input id="login-user" placeholder="Usuário" autocomplete="username" required>
    <input id="login-pass" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit" class="primary wide">Entrar</button>
    <p id="login-err" class="err"></p>
  </form>
</div>


<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <form id="modal-form" class="modal-card">
    <h2 id="modal-title">Título</h2>
    <p id="modal-text" class="modal-text hidden"></p>
    <input id="modal-input" type="text" autocomplete="off" maxlength="120">
    <div class="modal-actions">
      <button type="button" id="modal-cancel" class="btn ghost">Cancelar</button>
      <button type="submit" id="modal-ok" class="btn primary">OK</button>
    </div>
  </form>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="ui-utils.js"></script>
<script src="hermes-api.js"></script>
<script src="app.js"></script>
</body>
</html>
